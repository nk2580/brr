[package]
name = "brr-node-auth"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
getrandom = "0.3"
libc = "0.2"
rcgen = "=0.14.9"
rustls = "=0.23.46"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = "=0.3.55"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
