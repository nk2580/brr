[package]
name = "brr"
version = "0.1.0"
description = "A ChatGPT-powered desktop coding workspace"
authors = ["Brr contributors"]
edition = "2021"

[lib]
name = "brr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "net"] }
getrandom = "0.3"
url = "2"
worktrunk = { path = "../vendor/worktrunk", default-features = false }
brr-agent-core = { path = "../runtime/brr/agents" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
